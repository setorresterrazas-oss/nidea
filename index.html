<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE GAME — Sistema de Identidad</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap');

:root {
  --bg:      #16110b;
  --bg2:     #1e1710;
  --bg3:     #261d12;
  --bg4:     #2e2416;

  --border:  rgba(180,140,60,0.13);
  --border2: rgba(180,140,60,0.26);
  --border3: rgba(180,140,60,0.44);

  --text:    #e8dcc8;
  --muted:   #9b8a6a;
  --muted2:  #6b5a40;
  --gold:    #c9a227;
  --gold2:   #e2c45a;

  --c-color: #4a8fc4;
  --c-bg:    rgba(74,143,196,0.1);
  --c-border:rgba(74,143,196,0.26);
  --c-text:  #7eb3e0;
  --c-fill:  #4a8fc4;

  --a-color: #b84d72;
  --a-bg:    rgba(184,77,114,0.1);
  --a-border:rgba(184,77,114,0.26);
  --a-text:  #d48aa6;
  --a-fill:  #b84d72;

  --t-color: #9a6820;
  --t-bg:    rgba(154,104,32,0.1);
  --t-border:rgba(154,104,32,0.26);
  --t-text:  #c9963a;
  --t-fill:  #9a6820;

  --q-brilliant:#22d1e3;
  --q-great:    #5da0e8;
  --q-good:     #5cb85c;
  --q-dubious:  #e8c040;
  --q-mistake:  #e87d20;
  --q-blunder:  #e84040;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  background:var(--bg);
  color:var(--text);
  font-family:'Inter',sans-serif;
  font-size:14px;
  min-height:100vh;
  padding:20px;
}

/* ── HEADER ── */
.header{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:22px;padding-bottom:14px;
  border-bottom:1px solid var(--border2);
}
.title{
  font-family:'Playfair Display',serif;
  font-size:30px;font-weight:700;letter-spacing:0.05em;
  color:var(--gold2);
}
.subtitle{
  font-size:10px;letter-spacing:0.2em;color:var(--muted);
  margin-top:3px;text-transform:uppercase;
}
.date-badge{font-size:12px;color:var(--muted);font-style:italic;text-align:right}

/* ── IDENTITY CARDS ── */
.identity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.id-card{border-radius:8px;border:1px solid;padding:13px 14px;position:relative;overflow:hidden}
.id-card::before{
  content:'';position:absolute;top:-30px;right:-30px;
  width:80px;height:80px;border-radius:50%;opacity:0.05;
}
.id-card.c{border-color:var(--c-border);background:var(--c-bg)}
.id-card.c::before{background:var(--c-color)}
.id-card.a{border-color:var(--a-border);background:var(--a-bg)}
.id-card.a::before{background:var(--a-color)}
.id-card.t{border-color:var(--t-border);background:var(--t-bg)}
.id-card.t::before{background:var(--t-color)}

.id-label{font-size:9px;letter-spacing:0.12em;font-weight:600;text-transform:uppercase;margin-bottom:4px}
.id-pts{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;line-height:1}
.id-rank{font-size:11px;margin:3px 0 6px;opacity:0.72}
.id-footer{font-size:10px;opacity:0.52;margin-top:3px}
.id-card.c .id-label,.id-card.c .id-pts,.id-card.c .id-rank,.id-card.c .id-footer{color:var(--c-text)}
.id-card.a .id-label,.id-card.a .id-pts,.id-card.a .id-rank,.id-card.a .id-footer{color:var(--a-text)}
.id-card.t .id-label,.id-card.t .id-pts,.id-card.t .id-rank,.id-card.t .id-footer{color:var(--t-text)}

/* ── PROGRESS BAR ── */
.pb{height:3px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin:5px 0 3px}
.pf{height:100%;border-radius:2px;transition:width .5s ease}
.pf.c{background:var(--c-fill)}.pf.a{background:var(--a-fill)}.pf.t{background:var(--t-fill)}

/* ── DAILY PROGRESS ── */
.daily-bar{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 15px;margin-bottom:18px}
.daily-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.daily-label{font-size:12px;color:var(--muted)}
.daily-count{font-size:13px;font-weight:600;color:var(--text)}
.daily-pb{height:6px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden}
.daily-pf{height:100%;border-radius:3px;transition:width .5s ease}

/* ── TOAST ── */
#toast{
  position:fixed;bottom:22px;right:22px;
  background:var(--bg3);border:1px solid var(--border2);border-radius:8px;
  padding:10px 16px;font-size:13px;color:var(--text);max-width:260px;
  opacity:0;transform:translateY(8px);
  transition:opacity .25s,transform .25s;pointer-events:none;z-index:9999;line-height:1.5
}
#toast.show{opacity:1;transform:translateY(0)}
#toast .t-name{font-weight:600;font-family:'Playfair Display',serif}
#toast .t-streak{color:var(--gold);font-size:12px}
#toast .t-rank{color:var(--muted);font-size:11px;margin-top:2px}

/* ── SECTION HEADER ── */
.section-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:11px 0 7px;border-top:1px solid var(--border);
  margin-top:8px;cursor:pointer;user-select:none
}
.section-header:first-child{border-top:none;margin-top:0}
.section-title{
  font-family:'Playfair Display',serif;
  font-size:13px;font-weight:600;letter-spacing:0.04em
}
.section-title.c{color:var(--c-text)}
.section-title.a{color:var(--a-text)}
.section-title.t{color:var(--t-text)}
.section-toggle{font-size:11px;color:var(--muted2)}

/* ── HABIT ITEM ── */
.habit-item{
  display:flex;align-items:flex-start;gap:10px;
  padding:10px 12px;border-radius:7px;
  border:1px solid var(--border);margin-bottom:4px;
  cursor:pointer;background:var(--bg2);
  transition:background .15s,border-color .15s;
  -webkit-tap-highlight-color:transparent
}
.habit-item:hover{background:var(--bg3)}
.habit-item.done.c{background:var(--c-bg);border-color:var(--c-border)}
.habit-item.done.a{background:var(--a-bg);border-color:var(--a-border)}
.habit-item.done.t{background:var(--t-bg);border-color:var(--t-border)}

/* checkbox */
.checkbox{
  width:18px;height:18px;border-radius:4px;
  border:1.5px solid var(--border2);flex-shrink:0;
  margin-top:2px;position:relative;transition:all .15s
}
.checkbox.checked.c{background:var(--c-bg);border-color:var(--c-fill)}
.checkbox.checked.a{background:var(--a-bg);border-color:var(--a-fill)}
.checkbox.checked.t{background:var(--t-bg);border-color:var(--t-fill)}
.checkbox.checked::after{
  content:'';position:absolute;top:2px;left:5px;
  width:4px;height:7px;border-right:1.5px solid;border-bottom:1.5px solid;transform:rotate(45deg)
}
.checkbox.checked.c::after{border-color:var(--c-text)}
.checkbox.checked.a::after{border-color:var(--a-text)}
.checkbox.checked.t::after{border-color:var(--t-text)}

/* habit info */
.habit-info{flex:1;min-width:0}
.habit-name-row{display:flex;align-items:center;gap:6px}
.habit-name{
  font-size:14px;font-weight:400;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s
}
.habit-item.done .habit-name{color:var(--text);font-weight:500}
.habit-meta{font-size:11px;color:var(--muted2);margin-top:2px;display:flex;align-items:center;gap:6px}
.habit-rank-tag{padding:1px 6px;border-radius:3px;font-size:10px;font-weight:500}
.rank-tag-c{background:var(--c-bg);color:var(--c-text);border:1px solid var(--c-border)}
.rank-tag-a{background:var(--a-bg);color:var(--a-text);border:1px solid var(--a-border)}
.rank-tag-t{background:var(--t-bg);color:var(--t-text);border:1px solid var(--t-border)}

/* right side */
.habit-right{text-align:right;flex-shrink:0;min-width:44px}
.habit-pts{font-family:'Playfair Display',serif;font-size:15px;font-weight:600}
.habit-pts.c{color:var(--c-text)}.habit-pts.a{color:var(--a-text)}.habit-pts.t{color:var(--t-text)}
.habit-streak{font-size:11px;color:var(--gold);font-weight:500;margin-top:1px}
.habit-streak-bar{width:36px;height:2px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;margin-top:3px;margin-left:auto}
.habit-streak-fill{height:100%;border-radius:2px}
.streak-fill-c{background:var(--c-fill)}.streak-fill-a{background:var(--a-fill)}.streak-fill-t{background:var(--t-fill)}

/* ── QUALITY BADGES ── */
.q-badge{
  display:inline-flex;align-items:center;justify-content:center;
  width:18px;height:18px;border-radius:50%;
  font-size:8px;font-weight:700;color:#fff;flex-shrink:0;
  font-family:'Inter',sans-serif;letter-spacing:-0.03em
}
.q-badge.q-brilliant{
  background:var(--q-brilliant);
  border-radius:50%;width:18px;height:18px
}
.q-badge.q-great   {background:var(--q-great)}
.q-badge.q-good    {background:var(--q-good)}
.q-badge.q-dubious {background:var(--q-dubious)}
.q-badge.q-mistake {background:var(--q-mistake)}
.q-badge.q-blunder {background:var(--q-blunder)}

/* ── QUALITY PICKER ── */
.q-picker{
  display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:10px 12px;margin:3px 0 3px 28px;
  background:var(--bg3);border:1px solid var(--border2);border-radius:7px
}
.q-picker-lbl{font-size:10px;color:var(--muted);margin-right:2px;flex-shrink:0}
.q-opt{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;
  font-size:10px;font-weight:700;color:#fff;
  cursor:pointer;border:2px solid transparent;
  transition:transform .12s,border-color .12s;
  font-family:'Inter',sans-serif;flex-shrink:0
}
.q-opt:hover{transform:scale(1.18);border-color:rgba(255,255,255,0.45)}
.q-opt.q-opt-brilliant{
  background:var(--q-brilliant);border-radius:50%;
  width:34px;height:34px;border:2px solid transparent
}
.q-opt.q-opt-brilliant:hover{transform:scale(1.18);border-color:rgba(255,255,255,0.45)}
.q-opt.q-opt-great   {background:var(--q-great)}
.q-opt.q-opt-good    {background:var(--q-good)}
.q-opt.q-opt-dubious {background:var(--q-dubious)}
.q-opt.q-opt-mistake {background:var(--q-mistake)}
.q-opt.q-opt-blunder {background:var(--q-blunder)}
.q-cancel{
  font-size:10px;color:var(--muted2);cursor:pointer;
  margin-left:4px;padding:4px 8px;border-radius:4px;border:1px solid var(--border)
}
.q-cancel:hover{color:var(--muted)}

/* ── TOOLTIP HINT ── */
.q-hint{
  font-size:10px;color:var(--muted2);
  display:flex;align-items:center;gap:4px;flex-basis:100%;margin-top:2px
}
</style>
</head>
<body>

<div id="toast">
  <div class="t-name" id="t-name"></div>
  <div class="t-streak" id="t-streak"></div>
  <div class="t-rank" id="t-rank"></div>
</div>

<div class="header">
  <div>
    <div class="title">THE GAME</div>
    <div class="subtitle">Sistema de Identidad</div>
  </div>
  <div class="date-badge" id="date-badge"></div>
</div>

<div class="identity-grid" id="identity-grid"></div>

<div class="daily-bar">
  <div class="daily-header">
    <span class="daily-label">Progreso de hoy</span>
    <span class="daily-count" id="daily-count"></span>
  </div>
  <div class="daily-pb"><div class="daily-pf" id="daily-pf" style="width:0%"></div></div>
</div>

<div id="habits-container"></div>

<script>
// ── HABITS ───────────────────────────────────────────────
const HABITS = [
  {id:'dreams',       name:'Dreams',          k:'c', f:'Diario'},
  {id:'brilliant_h',  name:'Brilliant',       k:'c', f:'Diario'},
  {id:'facu',         name:'Facu',            k:'c', f:'5x/sem', parent:'human_behavior'},
  {id:'proyectos',    name:'Proyectos',       k:'c', f:'2x/sem', parent:'human_behavior'},
  {id:'participar',   name:'Participar',      k:'c', f:'Diario',  parent:'human_behavior'},
  {id:'charlar',      name:'Charlar',         k:'c', f:'Diario',  parent:'human_behavior'},
  {id:'lugar',        name:'Lugar',           k:'c', f:'Diario',  parent:'human_behavior'},
  {id:'torneo',       name:'Torneo',          k:'a', f:'Semanal'},
  {id:'train',        name:'Train',           k:'a', f:'2x/sem'},
  {id:'move',         name:'Move',            k:'a', f:'4x/sem'},
  {id:'music',        name:'Music',           k:'a', f:'2x/sem'},
  {id:'chess',        name:'Chess',           k:'a', f:'Diario'},
  {id:'flexy',        name:'Flexy',           k:'a', f:'Diario'},
  {id:'meditar',      name:'Meditar',         k:'t', f:'Diario'},
  {id:'let_him_cook', name:'Let him cook',    k:'t', f:'Diario'},
  {id:'inner_self',   name:'Inner self (us)', k:'t', f:'Diario'},
  {id:'dental',       name:'Dental',          k:'t', f:'Diario'},
  {id:'skin',         name:'Skin',            k:'t', f:'Diario'},
];

(function buildWeights(){
  const counts={c:0,a:0,t:0};
  HABITS.forEach(h=>counts[h.k]++);
  const avg=HABITS.length/3;
  HABITS._weights={c:avg/counts.c,a:avg/counts.a,t:avg/counts.t};
})();

const PARENTS={
  human_behavior:{id:'human_behavior',name:'Human Behavior',k:'c'},
};

const ID_CFG={c:{label:'Cientifico'},a:{label:'Artista'},t:{label:'Templado'}};

const HABIT_RANKS=[
  {n:'Inicio',m:0},{n:'Primera victoria',m:7},{n:'En proceso',m:15},
  {n:'Habito formado',m:33},{n:'Consistencia real',m:66},
  {n:'Mentalidad fuerte',m:100},{n:'Disciplina solida',m:150},
  {n:'Trascendencia',m:250},{n:'Ascendido',m:380},
];

const ID_RANKS=[
  {n:'Iniciado',m:0},{n:'Aprendiz',m:25},{n:'Practicante',m:80},
  {n:'Comprometido',m:200},{n:'Disciplinado',m:420},
  {n:'Maestro',m:750},{n:'Ascendido',m:1200},
];

// ── QUALITY SYSTEM ───────────────────────────────────────
const QUALITIES=[
  {id:'brilliant',symbol:'!!', label:'Brilliant',cls:'q-brilliant',delta:+3,color:'#22d1e3'},
  {id:'great',    symbol:'!',  label:'Great',    cls:'q-great',    delta:+1,color:'#5da0e8'},
  {id:'good',     symbol:'!?', label:'Good',     cls:'q-good',     delta: 0,color:'#5cb85c'},
  {id:'dubious',  symbol:'?!', label:'Dubious',  cls:'q-dubious',  delta:-1,color:'#e8c040'},
  {id:'mistake',  symbol:'?',  label:'Mistake',  cls:'q-mistake',  delta:-2,color:'#e87d20'},
  {id:'blunder',  symbol:'??', label:'Blunder',  cls:'q-blunder',  delta:-3,color:'#e84040',breaksStreak:true},
];
function getQuality(qid){return QUALITIES.find(q=>q.id===qid)||QUALITIES[2];}

const FREQ_NUM={'Diario':7,'5x/sem':5,'4x/sem':4,'2x/sem':2,'Semanal':1};

// ── UTILS ────────────────────────────────────────────────
function today(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function localStr(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function addDays(ds,n){const d=new Date(ds+'T12:00:00');d.setDate(d.getDate()+n);return localStr(d);}
function weekMonday(ds){
  const d=new Date(ds+'T12:00:00');
  const day=d.getDay();d.setDate(d.getDate()+(day===0?-6:1-day));return localStr(d);
}
function datesInWeek(mon){return Array.from({length:7},(_,i)=>addDays(mon,i));}

// ── STREAK ───────────────────────────────────────────────
function calcStreak(hist,freqStr){
  if(!hist||!hist.length)return 0;
  const freq=FREQ_NUM[freqStr]||7,set=new Set(hist),td=today();
  if(freq===7){
    let cur=new Date(td+'T12:00:00');
    if(!set.has(td))cur.setDate(cur.getDate()-1);
    let s=0;
    for(let i=0;i<1000;i++){if(set.has(localStr(cur))){s++;cur.setDate(cur.getDate()-1);}else break;}
    return s;
  }
  let monday=weekMonday(td),streakWeeks=0;
  for(let w=0;w<200;w++){
    const dates=datesInWeek(monday),completions=dates.filter(d=>set.has(d)).length;
    if(w===0){
      const todayIdx=dates.indexOf(td),daysLeft=6-todayIdx;
      if(completions>=freq)streakWeeks++;
      else if(completions+daysLeft>=freq){/*still achievable*/}
      else break;
    }else{if(completions>=freq)streakWeeks++;else break;}
    monday=addDays(monday,-7);
  }
  return streakWeeks*7;
}

// ── SHIELDS ──────────────────────────────────────────────
function getShields(hist,freqStr){
  const freq=FREQ_NUM[freqStr]||7;
  if(freq===7)return null;
  const total=7-freq,set=new Set(hist),td=today();
  const mon=weekMonday(td),dates=datesInWeek(mon),idx=dates.indexOf(td);
  const daysLeft=7-idx,completions=dates.slice(0,idx+1).filter(d=>set.has(d)).length;
  const remaining=Math.min(total,Math.max(0,daysLeft+completions-freq));
  return{total,remaining,used:total-remaining,completions,freq};
}

// ── RANK HELPERS ─────────────────────────────────────────
function getRank(v,arr){let r=arr[0];for(const x of arr)if(v>=x.m)r=x;return r;}
function getNext(v,arr){for(const x of arr)if(v<x.m)return x;return null;}
function progress(v,cur,nxt){if(!nxt)return 100;return Math.min(100,Math.round(((v-cur.m)/(nxt.m-cur.m))*100));}

// ── POINTS ───────────────────────────────────────────────
function calcPoints(d,freqStr){
  const s=calcStreak(d.hist,freqStr);
  return d.tot+Math.floor(s/7)*3+(d.bonusPts||0);
}

// ── PARENT HELPERS ───────────────────────────────────────
function parentStreak(pid){
  const ch=HABITS.filter(h=>h.parent===pid);
  if(!ch.length)return 0;
  return Math.min(...ch.map(h=>calcStreak(D[h.id]?.hist||[],h.f)));
}
function parentPoints(pid){
  return HABITS.filter(h=>h.parent===pid)
    .reduce((s,h)=>s+calcPoints(D[h.id]||{hist:[],best:0,tot:0,bonusPts:0},h.f),0);
}

// ── STORAGE ──────────────────────────────────────────────
function loadData(){
  try{const r=localStorage.getItem('the_game_v4');if(r)return JSON.parse(r);}catch(e){}
  return{};
}
function saveData(D){try{localStorage.setItem('the_game_v4',JSON.stringify(D));}catch(e){}}

// ── STATE ────────────────────────────────────────────────
let D=loadData();
let collapsed={c:false,a:false,t:false};
let collapsedSub={};
let activePicker=null;

HABITS.forEach(h=>{
  if(!D[h.id])D[h.id]={hist:[],best:0,tot:0,completedAt:0,bonusPts:0,qualityLog:{}};
  if(D[h.id].bonusPts===undefined)D[h.id].bonusPts=0;
  if(!D[h.id].qualityLog)D[h.id].qualityLog={};
  if(D[h.id].completedAt===undefined)D[h.id].completedAt=0;
});

// ── AUTO-BLUNDER CHECK ───────────────────────────────────
// Runs once per day. If streak was ≥3 and broke (now 0) and no shields → -3 pts.
function checkAutoBlunders(){
  const td=today();
  if(D._lastAutoCheck===td)return;
  HABITS.forEach(h=>{
    const d=D[h.id];if(!d)return;
    const prev=d.prevStreak||0;
    const cur=calcStreak(d.hist,h.f);
    if(prev>=3&&cur===0&&d.lastAutoBlunderDate!==td){
      const sh=getShields(d.hist,h.f);
      if(!sh||sh.remaining===0){
        d.bonusPts=(d.bonusPts||0)-3;
        d.lastAutoBlunderDate=td;
      }
    }
    d.prevStreak=cur;
  });
  D._lastAutoCheck=td;
  saveData(D);
}

// ── TOAST ────────────────────────────────────────────────
let toastTimer=null;
function showToast(name,streak,extra){
  document.getElementById('t-name').textContent=name;
  document.getElementById('t-streak').textContent=streak>0?streak+' días de racha':'';
  document.getElementById('t-rank').textContent=extra;
  const el=document.getElementById('toast');
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),3200);
}

// ── TOGGLE ───────────────────────────────────────────────
function toggle(id){
  const td=today(),d=D[id],had=d.hist.includes(td);
  if(had){
    // Undo: refund quality delta
    d.hist=d.hist.filter(x=>x!==td);
    d.tot=Math.max(0,d.tot-1);
    d.completedAt=0;
    const prev=d.qualityLog[td];
    if(prev){d.bonusPts=(d.bonusPts||0)-getQuality(prev).delta;delete d.qualityLog[td];}
    activePicker=null;
  }else{
    activePicker=activePicker===id?null:id;
  }
  saveData(D);render();
}

function applyQuality(id,qualityId){
  const td=today(),d=D[id],h=HABITS.find(x=>x.id===id);
  const alreadyDone=d.hist.includes(td);
  if(!alreadyDone){
    d.hist.push(td);d.tot++;d.completedAt=Date.now();
    const cut=new Date();cut.setDate(cut.getDate()-150);
    d.hist=d.hist.filter(x=>new Date(x)>=cut);
  }
  // Apply quality delta
  const q=getQuality(qualityId);
  const prevQ=d.qualityLog[td];
  if(prevQ){d.bonusPts=(d.bonusPts||0)-getQuality(prevQ).delta;}
  d.qualityLog[td]=qualityId;
  d.bonusPts=(d.bonusPts||0)+q.delta;
  // Blunder breaks streak only if streak was ≥ 3
  if(q.breaksStreak){
    const s=calcStreak(d.hist,h.f);
    if(s>=3){
      // Wipe history to force streak=0
      d.hist=d.hist.filter(x=>x!==td); // keep completed but streak calc will see gap
      d.prevStreak=0;
    }
  }
  d.best=Math.max(d.best||0,calcStreak(d.hist,h.f));
  d.prevStreak=calcStreak(d.hist,h.f);
  activePicker=null;
  saveData(D);
  const ns=calcStreak(d.hist,h.f);
  showToast(h.name+' — '+q.symbol+' '+q.label, ns, getRank(ns,HABIT_RANKS).n+(q.delta!==0?' ('+( q.delta>0?'+':'')+q.delta+' pts)':''));
  render();
}

function toggleSection(k){collapsed[k]=!collapsed[k];activePicker=null;render();}
function toggleSub(pid){collapsedSub[pid]=!collapsedSub[pid];activePicker=null;render();}

// ── QUALITY PICKER ───────────────────────────────────────
function buildQualityPicker(id){
  const wrap=document.createElement('div');
  wrap.className='q-picker';
  wrap.onclick=e=>e.stopPropagation();

  const lbl=document.createElement('span');
  lbl.className='q-picker-lbl';lbl.textContent='Calidad:';
  wrap.appendChild(lbl);

  QUALITIES.forEach(q=>{
    const btn=document.createElement('div');
    btn.className=`q-opt q-opt-${q.id}`;
    btn.title=`${q.label} (${q.delta>0?'+':''}${q.delta} pts)`;
    btn.textContent=q.symbol;
    btn.onclick=e=>{e.stopPropagation();applyQuality(id,q.id);};
    wrap.appendChild(btn);
  });

  const hint=document.createElement('div');
  hint.className='q-hint';
  hint.innerHTML='<span>!! +3 &nbsp; ! +1 &nbsp; !? 0 &nbsp; ?! −1 &nbsp; ? −2 &nbsp; ?? −3 + rompe racha</span>';
  wrap.appendChild(hint);

  const cancel=document.createElement('span');
  cancel.className='q-cancel';cancel.textContent='✕';
  cancel.onclick=e=>{e.stopPropagation();activePicker=null;render();};
  wrap.appendChild(cancel);
  return wrap;
}

// ── QUALITY BADGE ────────────────────────────────────────
function qualityBadgeEl(qualityId){
  if(!qualityId||qualityId==='good')return null;
  const q=getQuality(qualityId);
  const el=document.createElement('span');
  el.className=`q-badge ${q.cls}`;
  el.title=q.label;
  el.textContent=q.symbol;
  return el;
}

// ── HABIT ROW ────────────────────────────────────────────
function habitRow(h,td,k,indented){
  const d=D[h.id]||{hist:[],best:0,tot:0,bonusPts:0,qualityLog:{}};
  const isDone=d.hist.includes(td);
  const s=calcStreak(d.hist,h.f);
  const pts=calcPoints(d,h.f);
  const rk=getRank(s,HABIT_RANKS);
  const nxt=getNext(s,HABIT_RANKS);
  const pr=progress(s,rk,nxt);
  const sh=getShields(d.hist,h.f);
  const todayQ=isDone?d.qualityLog?.[td]:null;
  const showPicker=activePicker===h.id&&!isDone;

  const wrap=document.createElement('div');
  if(indented)wrap.style.marginLeft='20px';

  // Shields
  let shieldHTML='';
  if(sh){
    const icons=Array.from({length:sh.total},(_,i)=>
      `<span style="font-size:11px;opacity:${i<sh.remaining?1:0.18}">🛡</span>`
    ).join('');
    const lbl=(sh.remaining===0&&sh.completions<sh.freq)
      ?`<span style="font-size:10px;color:#e84040;font-weight:600">¡Hazlo ya!</span>`
      :`<span style="font-size:10px;color:var(--muted2)">${sh.completions}/${sh.freq} esta sem</span>`;
    shieldHTML=`<div style="display:flex;align-items:center;gap:3px;margin-top:3px;flex-wrap:wrap">${icons} ${lbl}</div>`;
  }

  const streakLabel=sh&&Math.round(s/7)>0?Math.round(s/7)+'sem':s+'d';

  const item=document.createElement('div');
  item.className=`habit-item${isDone?' done '+k:''}`;

  const nameRow=document.createElement('div');
  nameRow.className='habit-name-row';
  const nameEl=document.createElement('span');
  nameEl.className='habit-name';nameEl.textContent=h.name;
  nameRow.appendChild(nameEl);
  const badge=qualityBadgeEl(todayQ);
  if(badge)nameRow.appendChild(badge);

  item.innerHTML=`
    <div class="checkbox ${isDone?'checked '+k:''}"></div>
    <div class="habit-info">
      <div class="habit-meta">
        <span style="opacity:0.7">${h.f}</span>
        <span class="habit-rank-tag rank-tag-${k}">${rk.n}</span>
      </div>
      ${shieldHTML}
    </div>
    <div class="habit-right">
      <div class="habit-pts ${k}">${pts}</div>
      ${s>0?`<div class="habit-streak">${streakLabel}</div>`:''}
      ${s>0&&nxt?`<div class="habit-streak-bar"><div class="habit-streak-fill streak-fill-${k}" style="width:${pr}%"></div></div>`:''}
    </div>
  `;
  // Insert name row at top of habit-info
  const info=item.querySelector('.habit-info');
  info.insertBefore(nameRow,info.firstChild);

  item.addEventListener('click',()=>toggle(h.id));
  wrap.appendChild(item);
  if(showPicker)wrap.appendChild(buildQualityPicker(h.id));
  return wrap;
}

// ── PARENT BLOCK ─────────────────────────────────────────
function renderParentBlock(parentId,k,td){
  const par=PARENTS[parentId];
  const children=HABITS.filter(h=>h.parent===parentId);
  const sortedCh=[
    ...children.filter(h=>!D[h.id]?.hist?.includes(td)),
    ...children.filter(h=> D[h.id]?.hist?.includes(td))
               .sort((a,b)=>(D[b.id]?.completedAt||0)-(D[a.id]?.completedAt||0)),
  ];
  const ps=parentStreak(parentId);
  const ppts=parentPoints(parentId);
  const prk=getRank(ps,HABIT_RANKS);
  const pnxt=getNext(ps,HABIT_RANKS);
  const ppr=progress(ps,prk,pnxt);
  const dnKids=children.filter(h=>D[h.id]?.hist?.includes(td)).length;
  const isColl=collapsedSub[parentId];

  const wrap=document.createElement('div');
  wrap.style.marginBottom='4px';

  const pRow=document.createElement('div');
  pRow.style.cssText=`
    display:flex;align-items:center;gap:10px;padding:10px 12px;
    border-radius:7px;border:1px solid var(--c-border);
    background:var(--c-bg);cursor:pointer;margin-bottom:3px;
  `;
  pRow.innerHTML=`
    <div style="width:18px;height:18px;border-radius:4px;background:var(--c-bg);
      border:1.5px solid var(--c-fill);display:flex;align-items:center;
      justify-content:center;flex-shrink:0;font-size:10px;color:var(--c-text)">
      ${isColl?'▶':'▼'}
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-family:'Playfair Display',serif;font-size:14px;font-weight:600;color:var(--c-text)">
        ${par.name}
        <span style="font-size:10px;font-weight:400;color:var(--muted2);
          margin-left:6px;font-family:'Inter',sans-serif">
          subgrupo · ${dnKids}/${children.length} hoy
        </span>
      </div>
      <div style="display:flex;align-items:center;gap:6px;margin-top:3px">
        <span style="font-size:10px;color:var(--muted2)">racha mín:</span>
        <span style="font-size:11px;font-weight:500;padding:1px 6px;border-radius:3px;
          background:var(--c-bg);color:var(--c-text);border:1px solid var(--c-border)">
          ${prk.n}
        </span>
        ${ps>0&&pnxt?`<div style="flex:1;max-width:60px;height:2px;
          background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden">
          <div style="width:${ppr}%;height:100%;background:var(--c-fill)"></div></div>`:''}
      </div>
    </div>
    <div style="text-align:right;flex-shrink:0">
      <div style="font-family:'Playfair Display',serif;font-size:14px;
        font-weight:600;color:var(--c-text)">${ppts}</div>
      ${ps>0?`<div style="font-size:11px;color:var(--gold)">${ps}d</div>`:''}
    </div>
  `;
  pRow.addEventListener('click',()=>toggleSub(parentId));
  wrap.appendChild(pRow);
  if(!isColl)sortedCh.forEach(h=>wrap.appendChild(habitRow(h,td,k,true)));
  return wrap;
}

// ── RENDER ───────────────────────────────────────────────
function render(){
  const td=today();
  const fmt=new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());
  document.getElementById('date-badge').textContent=fmt.charAt(0).toUpperCase()+fmt.slice(1);

  // Identity points (weighted)
  const ip={c:0,a:0,t:0};
  const W=HABITS._weights;
  HABITS.forEach(h=>ip[h.k]+=calcPoints(D[h.id]||{hist:[],tot:0,bonusPts:0},h.f)*W[h.k]);
  ['c','a','t'].forEach(k=>ip[k]=Math.round(ip[k]));

  // Identity cards
  const grid=document.getElementById('identity-grid');
  grid.innerHTML='';
  ['c','a','t'].forEach(k=>{
    const pts=ip[k]||0,rk=getRank(pts,ID_RANKS),nxt=getNext(pts,ID_RANKS),pr=progress(pts,rk,nxt);
    const hl=HABITS.filter(h=>h.k===k),dn=hl.filter(h=>D[h.id]?.hist?.includes(td)).length;
    const card=document.createElement('div');
    card.className='id-card '+k;
    card.innerHTML=`
      <div class="id-label">${ID_CFG[k].label}</div>
      <div class="id-pts">${pts}</div>
      <div class="id-rank">${rk.n}</div>
      <div class="pb"><div class="pf ${k}" style="width:${pr}%"></div></div>
      <div class="id-footer">${dn}/${hl.length} hoy${nxt?' · '+nxt.n:' · MAX'}</div>
    `;
    grid.appendChild(card);
  });

  // Daily progress
  const done=HABITS.filter(h=>D[h.id]?.hist?.includes(td)).length;
  const pct=Math.round((done/HABITS.length)*100);
  document.getElementById('daily-count').textContent=
    `${done}/${HABITS.length} — ${pct}%${pct===100?' — Perfecto!':''}`;
  const dpf=document.getElementById('daily-pf');
  dpf.style.width=pct+'%';
  dpf.style.background=pct===100?'#5cb85c':'#c9a227';

  // Habits
  const container=document.getElementById('habits-container');
  container.innerHTML='';
  ['c','a','t'].forEach(k=>{
    const isC=collapsed[k];
    const sec=document.createElement('div');
    sec.className='section-header';
    sec.innerHTML=`
      <span class="section-title ${k}">${ID_CFG[k].label}</span>
      <span class="section-toggle">${isC?'mostrar ▼':'ocultar ▲'}</span>
    `;
    sec.addEventListener('click',()=>toggleSection(k));
    container.appendChild(sec);
    if(isC)return;

    const standalone=HABITS.filter(h=>h.k===k&&!h.parent);
    const sorted=[
      ...standalone.filter(h=>!D[h.id]?.hist?.includes(td)),
      ...standalone.filter(h=> D[h.id]?.hist?.includes(td))
                   .sort((a,b)=>(D[b.id]?.completedAt||0)-(D[a.id]?.completedAt||0)),
    ];
    sorted.forEach(h=>container.appendChild(habitRow(h,td,k,false)));
    Object.values(PARENTS).filter(p=>p.k===k)
      .forEach(p=>container.appendChild(renderParentBlock(p.id,k,td)));
  });
}

checkAutoBlunders();
render();
</script>
